name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Install selected Android SDK packages
        # Hosted Android runners have accepted SDK licenses. EOF fails rather
        # than silently accepting a newly required license.
        run: bash tools/android-setup.sh </dev/null
      - name: Build, unit test, lint, and compile instrumentation tests
        working-directory: src/BunDo.Android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Upload failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-reports
          path: src/BunDo.Android/app/build/reports/
          if-no-files-found: ignore
