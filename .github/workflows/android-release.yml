name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version, for example 0.1.0-rc.1
        required: true
        default: 0.1.0-rc.1

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate version and refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Release tag already exists. Choose a new version." >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: bash tools/android-setup.sh </dev/null
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUNDO_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bundo-release.jks"
      - name: Build signed release, test, lint and inventory
        env:
          BUNDO_KEYSTORE_PATH: ${{ runner.temp }}/bundo-release.jks
          BUNDO_STORE_PASSWORD: ${{ secrets.BUNDO_STORE_PASSWORD }}
          BUNDO_KEY_PASSWORD: ${{ secrets.BUNDO_KEY_PASSWORD }}
          BUNDO_KEY_ALIAS: ${{ secrets.BUNDO_KEY_ALIAS }}
        working-directory: src/BunDo.Android
        run: |
          ./gradlew --no-daemon \
            -PbundoVersionName="$VERSION" -PbundoVersionCode="$((VERSION_CODE + 100))" \
            assembleRelease testReleaseUnitTest lintRelease releaseInventory
      - name: Verify and package
        run: |
          mkdir -p release
          apk="release/bun-do-$VERSION-arm64.apk"
          cp src/BunDo.Android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > release/signature.txt
          grep -Fqi 'c3ec25d5d78f92b3f7de398c92206afb416f7d51c5e4ac771fc9b9c57fc76bcd' release/signature.txt
          cp docs/android-release.md release/INSTALL.md
          cp docs/android-licenses.md release/LICENSES.md
          cp -R src/BunDo.Android/app/build/release-inventory release/dependency-inventory
          git rev-parse HEAD > release/COMMIT.txt
          (cd release && sha256sum *.apk > SHA256SUMS)
          tar -czf "release/bun-do-$VERSION-inventory.tar.gz" -C release dependency-inventory LICENSES.md COMMIT.txt signature.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag=false --target "$GITHUB_SHA" \
            --prerelease --title "Bun Do $VERSION" --notes-file release/INSTALL.md \
            release/*.apk release/*.tar.gz release/SHA256SUMS release/signature.txt
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-reports
          path: src/BunDo.Android/app/build/reports/
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/bundo-release.jks"
