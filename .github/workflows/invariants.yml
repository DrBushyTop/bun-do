name: Repository invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and schema history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Test invariant checks and hooks
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check repository invariants
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          BASE_REV=$(python3 tools/ci_schema_base.py)
          python3 tools/check_invariants.py --git-base "$BASE_REV"
